<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopSphere | Modern eCommerce</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ========================= NAVBAR ========================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">
          <i class="bi bi-bag-fill"></i>
          ShopSphere
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active route-link" href="#" data-page="home">
                Home
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link route-link" href="#" data-page="products">
                Products
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link route-link" href="#" data-page="about">
                About
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link route-link" href="#" data-page="contact">
                Contact
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- ========================================================= -->
    <!-- HOME PAGE -->
    <!-- ========================================================= -->

    <section id="home" class="page">
      <!-- HERO -->

      <header class="hero">
        <div class="container">
          <div class="row align-items-center">
            <div class="col-lg-6">
              <h1 class="display-4 fw-bold">Discover Amazing Products</h1>

              <p class="lead mt-3">
                Premium quality products at unbeatable prices. Fast Delivery •
                Secure Payments • Trusted Store
              </p>

              <button
                class="btn btn-primary btn-lg mt-3 route-link"
                data-page="products"
              >
                Shop Now
              </button>
            </div>

            <div class="col-lg-6 text-center">
              <img
                src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=900"
                class="img-fluid hero-image"
                alt="Shopping"
              />
            </div>
          </div>
        </div>
      </header>
    </section>
  </body>
</html>
